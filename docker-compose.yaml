services:
  dbCp:
    image: postgres:14
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - ./postgresql/db:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odooCp:
    image: odoo:18.0
    depends_on:
      dbCp:
        condition: service_healthy
    volumes:
      - ./src:/mnt/extra-addons
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf
    ports:
      - "8090:8069"
    environment:
      DB_HOST: dbCp
      DB_USER: odoo
      DB_PASSWORD: odoo
      DB_PORT: 5432
    networks:
      - odoo_net

networks:
  odoo_net:
    driver: bridge

